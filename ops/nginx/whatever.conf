# nginx на сервере перед Whatever: принимает соединения на 80/443 и передаёт их приложению
# на 127.0.0.1:8080. TLS-сертификат добавляет certbot (docs/deploy-vps.md, шаг 7):
#
#     sudo cp ops/nginx/whatever.conf /etc/nginx/sites-available/whatever.conf
#     sudo sed -i 's/whatever.example.ru/ваш.домен/' /etc/nginx/sites-available/whatever.conf
#     sudo ln -s /etc/nginx/sites-available/whatever.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d ваш.домен --redirect
#
# В .env приложения при этом: WHATEVER_BIND_ADDRESS=127.0.0.1, WHATEVER_COOKIE_SECURE=true,
# WHATEVER_TRUSTED_PROXY=172.16.0.0/12.

# WebSocket: заголовок Connection: upgrade — только когда клиент его просит.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name whatever.example.ru;
    server_tokens off;

    # Размер загружаемых файлов проверяет приложение (WHATEVER_MAX_UPLOAD_MB) и отвечает
    # понятной ошибкой. Здесь ограничения нет, иначе nginx отклонит всё больше 1 МБ.
    client_max_body_size 0;
    # Файл сразу уходит приложению по частям, а не копится на диске этого nginx.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Host без изменений: приложение сверяет его с Origin.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Доска может быть открыта часами; живость соединения проверяют пинги WebSocket.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
