# Whatever на одном сервере. Настройки — в .env рядом с этим файлом (см. .env.example):
#
#     cp .env.example .env      # задайте POSTGRES_PASSWORD
#     docker compose up -d --build
#
# Наружу публикуется только nginx (сервис frontend). База и бэкенд доступны лишь внутри
# сети compose.

# Учётные данные базы получают и сервер PostgreSQL, и бэкенд: значения совпадают всегда.
x-database: &database
  POSTGRES_USER: ${POSTGRES_USER:-whatever}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
  POSTGRES_DB: ${POSTGRES_DB:-whatever}

# Журналы контейнеров ограничены по размеру, иначе со временем займут весь диск.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Образы: готовые из реестра (WHATEVER_IMAGE_PREFIX и WHATEVER_VERSION, см. docs/operations.md)
# или собранные на сервере из этой папки, если их нет.
x-backend: &backend
  build: ./backend
  image: ${WHATEVER_IMAGE_PREFIX:-whatever}-backend:${WHATEVER_VERSION:-dev}
  env_file: .env
  environment:
    <<: *database
    # Адрес базы внутри сети compose. Задан здесь явно, чтобы POSTGRES_HOST
    # и POSTGRES_PORT из .env для разработки не увели бэкенд на чужой адрес.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    # Бэкенд недоступен снаружи: к нему обращается только nginx.
    WHATEVER_FORWARDED_ALLOW_IPS: ${WHATEVER_FORWARDED_ALLOW_IPS:-*}
    # Картинки и вложения досок лежат в томе files-data (см. сервис backend).
    WHATEVER_FILES_DIR: /var/lib/whatever/files
  depends_on:
    postgres:
      condition: service_healthy
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    environment: *database
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Применяет миграции и завершается. Бэкенд стартует только после успешного выполнения,
  # поэтому никогда не работает со старой схемой базы.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  backend:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - files-data:/var/lib/whatever/files
    restart: unless-stopped
    # Время на штатную остановку: бэкенд дописывает в базу изменения открытых досок.
    stop_grace_period: 30s

  # Ежедневная резервная копия базы и файлов досок в папку WHATEVER_BACKUP_DIR на сервере
  # (см. ops/backup.sh и docs/operations.md). Копия сейчас: make backup.
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-whatever}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
      PGDATABASE: ${POSTGRES_DB:-whatever}
      BACKUP_HOUR: ${WHATEVER_BACKUP_HOUR:-0}
      BACKUP_KEEP_DAYS: ${WHATEVER_BACKUP_KEEP_DAYS:-14}
    # От root: папку копий на сервере создаёт Docker, и она принадлежит root.
    entrypoint: ["/ops/backup.sh"]
    command: ["schedule"]
    volumes:
      # Папка, а не файл: файл, подключённый отдельно, после git pull остался бы старым.
      - ./ops:/ops:ro
      - files-data:/files:ro
      - ${WHATEVER_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  frontend:
    build: ./frontend
    image: ${WHATEVER_IMAGE_PREFIX:-whatever}-frontend:${WHATEVER_VERSION:-dev}
    ports:
      # WHATEVER_BIND_ADDRESS=127.0.0.1 — только для прокси с TLS на этом же сервере.
      - "${WHATEVER_BIND_ADDRESS:-0.0.0.0}:${WHATEVER_PORT:-8080}:8080"
    environment:
      # Адрес внешнего прокси (TLS), если он есть. 127.0.0.1 — внешнего прокси нет.
      WHATEVER_TRUSTED_PROXY: ${WHATEVER_TRUSTED_PROXY:-127.0.0.1}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
  # Картинки и вложения досок. Копируется вместе с базой (см. docs/operations.md).
  files-data:
